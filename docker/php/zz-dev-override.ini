; Override DEV saja (di-mount docker-compose.override.yml).
; Image dasar memakai opcache.validate_timestamps=0 (benar untuk produksi:
; kode diganti dengan container baru). Di dev, server artisan serve hidup lama,
; jadi tanpa override ini perubahan file TIDAK pernah terbaca (hot-reload mati).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
