server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers untuk semua response (termasuk /assets/ via include).
    include /etc/nginx/conf.d/nginx-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Headers tidak diwarisi — ulang via snippet.
        include /etc/nginx/conf.d/nginx-headers.conf;
    }

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
