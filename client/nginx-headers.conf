# Snippet security headers — di-include di level server dan di location /assets/
# (add_header TIDAK diwarisi oleh location yang punya add_header sendiri).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP: connect-src 'self' https: — origin API produksi beda host (https),
# plain-HTTP diblokir (tidak ada lagi http://localhost:* di produksi).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
