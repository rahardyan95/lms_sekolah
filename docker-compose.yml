# Base = production-safe defaults.
# Lokal dev: `docker compose up` (otomatis gabung override dev).
# Prod simulasi/VPS: `docker compose -f docker-compose.yml up --build -d`.
services:
  db:
    image: postgres:17-alpine
    container_name: lms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lms_sekolah}
      POSTGRES_USER: ${DB_USERNAME:-lms}
      # Fail-closed: tanpa default lemah. Dev mengisi via .env (lihat .env.example);
      # production wajib password kuat (dienforce entrypoint.sh + app:readiness).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi (lihat .env.example)}
    # Keamanan: tanpa ports: di base (prod) — hanya reachable via lms-net.
    # Dev: port host dipublish ulang di docker-compose.override.yml.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lms} -d ${DB_DATABASE:-lms_sekolah}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-net

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # requirepass aktif bila REDIS_PASSWORD diisi (wajib di production);
    # tanpa ports: di base — hanya reachable via lms-net.
    command: ["sh", "-c", "exec redis-server --appendonly yes $( [ -n \"$REDIS_PASSWORD\" ] && printf '--requirepass %s' \"$REDIS_PASSWORD\" )"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping >/dev/null 2>&1 || redis-cli -a \"$$REDIS_PASSWORD\" ping >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-net

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: lms_meili
    restart: unless-stopped
    environment:
      # Fail-closed: tanpa default master key. Dev mengisi via .env;
      # production wajib kunci kuat (dienforce entrypoint.sh + app:readiness).
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY wajib diisi (lihat .env.example)}
      MEILI_NO_ANALYTICS: "true"
    # Tanpa ports: di base — hanya reachable via lms-net.
    volumes:
      - meilidata:/meili_data
    networks:
      - lms-net

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: lms_mailpit
    restart: unless-stopped
    profiles: ["dev"]
    # DEV-only (profile): tidak ikut `docker compose -f docker-compose.yml up` prod.
    # Lokal dev tetap aktif via override yang mengaktifkan profile dev.
    networks:
      - lms-net

  caddy:
    image: caddy:2-alpine
    container_name: lms_caddy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Prod TLS: set CADDYFILE=Caddyfile.prod di .env server (default: Caddyfile dev :80).
      - ./docker/caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Dipakai Caddyfile.prod (ACME + site blocks). Kosong = Caddy gagal start
      # dengan pesan jelas, bukan silent http.
      API_HOST: ${API_HOST:-}
      FRONTEND_HOST: ${FRONTEND_HOST:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - lms-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # Runtime produksi: FrankenPHP + Octane. Dev override memakai target `cli`.
      target: prod
    container_name: lms_backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      MEILISEARCH_HOST: http://meilisearch:7700
      MAIL_HOST: mailpit
    volumes:
      - storage_data:/var/www/html/storage/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/up | grep -qi up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - lms-net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      # Worker CLI tidak butuh FrankenPHP — pakai target `cli` (lebih ringan).
      target: cli
    container_name: lms_queue
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      MEILISEARCH_HOST: http://meilisearch:7700
      MAIL_HOST: mailpit
    volumes:
      - storage_data:/var/www/html/storage/app
    entrypoint: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--sleep=3"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[q]ueue:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - lms-net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      # Sama seperti queue: cukup CLI target.
      target: cli
    container_name: lms_scheduler
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    volumes:
      - storage_data:/var/www/html/storage/app
    entrypoint: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[s]chedule:work' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - lms-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: prod
      args:
        # TANPA fallback localhost: build prod wajib VITE_API_URL dari .env
        # (deploy.sh gagal-cepat bila kosong; ApiClient juga fail-fast di runtime).
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: lms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -qi ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lms-net

volumes:
  pgdata:
  redisdata:
  meilidata:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  lms-net:
    driver: bridge
